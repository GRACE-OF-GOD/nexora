name: nexora
description: Application de gestion scolaire NEXORA
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # Gestion d'état
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Appels HTTP
  dio: ^5.4.3

  # Stockage sécurisé du JWT
  flutter_secure_storage: ^9.2.2

  # Sauvegarde des préférences (thème)
  shared_preferences: ^2.3.2

  # Icones Material
  material_symbols_icons: ^4.2719.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true